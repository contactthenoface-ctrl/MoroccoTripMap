<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoroccoTripMap - Accueil</title>
    <!-- Lien vers ton fichier CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>MoroccoTripMap</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Rechercher une ville..." onkeyup="searchDestinations()">
            <div id="searchResults" class="search-results"></div>
        </div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="destinations.html">Destinations</a>
        </nav>
    </header>

    <div class="hero">
        <h2>Explorez la beauté du Maroc</h2>
        <p>Découvrez les meilleures destinations pour votre prochain voyage.</p>
    </div>

    <div class="container">
        <h2 style="text-align: center; margin-bottom: 30px;">Villes à la une</h2>
        <div class="grid">
            <a href="marrakech.html" class="card-link">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1597212720188-75782787fc20" alt="Médina de Marrakech">
                    <h3>Marrakech</h3>
                </div>
            </a>
            <a href="fes.html" class="card-link">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1552086382-749e79435bda" alt="Artisanat à Fès">
                    <h3>Fès</h3>
                </div>
            </a>
            <a href="chefchaouen.html" class="card-link">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1571210214813-f661c92b2382" alt="Ruelles bleues">
                    <h3>Chefchaouen</h3>
                </div>
            </a>
        </div>
    </div>

    <!-- Lien vers ton fichier Javascript juste avant la fin du body -->
    <script src="js/search.js"></script>
</body>
</html>
