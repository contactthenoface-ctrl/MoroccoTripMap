<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toutes les Destinations - MoroccoTripMap</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>MoroccoTripMap</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Rechercher une destination..." onkeyup="searchDestinations()">
            <div id="searchResults" class="search-results"></div>
        </div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="destinations.html">Destinations</a>
        </nav>
    </header>

    <div class="container">
        <h2 style="text-align: center; margin-bottom: 30px;">Toutes nos destinations</h2>
        <div class="grid">
            <a href="marrakech.html" class="card-link">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1597212720188-75782787fc20" alt="Marrakech">
                    <h3>Marrakech</h3>
                </div>
            </a>
            <a href="fes.html" class="card-link">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1552086382-749e79435bda" alt="Fès">
                    <h3>Fès</h3>
                </div>
            </a>
            <a href="chefchaouen.html" class="card-link">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1571210214813-f661c92b2382" alt="Chefchaouen">
                    <h3>Chefchaouen</h3>
                </div>
            </a>
            <a href="tanger.html" class="card-link">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1616091216791-a5360b5ce757" alt="Tanger">
                    <h3>Tanger</h3>
                </div>
            </a>
        </div>
    </div>

    <script src="js/search.js"></script>
</body>
</html>
