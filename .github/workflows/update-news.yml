name: Update Morocco tourism news feed

# Runs automatically every day at 06:00 UTC, and can also be triggered
# manually from the "Actions" tab in GitHub (workflow_dispatch), or
# automatically whenever this workflow file itself changes.
#
# Want it more frequent than daily? Change the cron line below, e.g.:
#   "0 */6 * * *"  -> every 6 hours
#   "0 * * * *"    -> every hour
# GitHub Actions on free/public repos supports schedules down to every
# 5 minutes, but there's no real benefit going that fast for a news feed â€”
# once or a few times a day is plenty and keeps you well within GitHub's
# free Actions minutes.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest Morocco tourism news
        run: python3 js/fetch-news.py

      - name: Commit and push if data/news.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No news changes today."
          else
            git commit -m "chore: update Morocco tourism news feed [skip ci]"
            git push
          fi
