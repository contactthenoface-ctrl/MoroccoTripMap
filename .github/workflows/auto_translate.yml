name: Auto Translation Engine

on:
  push:
    branches:
      - main
    paths:
      - '**.html'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 deep-translator

      - name: Generate Translations
        run: |
          python update_translations.py

      - name: Commit & Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add translations.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: mise a jour automatique de translations.json" && git push)
